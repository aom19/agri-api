# docker-compose.dev.yml
# Stack complet pentru dezvoltare: aplicație + infrastructură
# Folosire: docker compose -f infrastructure/compose/docker-compose.dev.yml up --build
#
# Diferente față de prod:
#   - porturile DB și Redis sunt expuse local (pentru acces direct / GUI tools)
#   - GIN_MODE=debug
#   - codul sursă este montat ca volum → hot-reload cu air

name: agri-api-dev

services:
  migrate:
    image: migrate/migrate:v4.18.1
    container_name: agri_migrate_dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../migrations:/migrations
    command: ["-path=/migrations", "-database=postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}", "up"]
    restart: on-failure

  app:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: agri_app_dev
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - GIN_MODE=debug
      - DB_HOST=db
      - REDIS_ADDR=redis:6379
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16
    container_name: agri_postgres_dev
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agri_redis_dev
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-agri123}
    ports:
      - "6379:6379"
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-agri123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
  redisdata_dev:
