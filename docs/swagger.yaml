  handlers.CreateImplementRequest:
    properties:
      brand:
        type: string
      capacity:
        type: number
      code:
        type: string
      fuel_type:
        $ref: '#/definitions/domain.FuelType'
      model:
        type: string
      name:
        type: string
      notes:
        type: string
      registration_number:
        type: string
      type:
        $ref: '#/definitions/domain.ImplementType'
      working_width:
        type: number
      year:
        type: integer
    required:
    - code
    - name
    - type
    type: object
  handlers.CreateMachineRequest:
    properties:
      brand:
        type: string
      code:
        type: string
      fuel_type:
        $ref: '#/definitions/domain.FuelType'
      model:
        type: string
      name:
        type: string
      notes:
        type: string
      registration_number:
        type: string
      type:
        $ref: '#/definitions/domain.MachineType'
