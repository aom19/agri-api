      email:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
    required:
    - name
    type: object
  handlers.CurrentWeatherResponse:
    properties:
      cloud_cover_percent:
        type: integer
      condition:
        type: string
      humidity_percent:
        type: integer
      icon:
        type: string
      location:
        type: string
      observed_at:
        type: string
      precipitation_mm:
        type: number
      source:
        type: string
      temperature_c:
        type: integer
      weather_code:
        type: integer
      wind_direction_deg:
        type: integer
      wind_speed_kmh:
        type: number
    type: object
  handlers.DashboardCardsResponse:
    properties:
