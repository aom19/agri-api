basePath: /api
definitions:
  domain.AssetStatus:
    enum:
    - active
    - maintenance
    - inactive
    - active
    - maintenance
    - inactive
    type: string
    x-enum-varnames:
    - AssetStatusActive
    - AssetStatusMaintenance
    - AssetStatusInactive
    - MachineStatusActive
    - MachineStatusMaintenance
    - MachineStatusInactive
  domain.Assigment:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      end_date:
        type: string
      id:
        type: integer
      machine_id:
        type: integer
      operator_id:
        type: integer
      start_date:
        type: string
      status:
        $ref: '#/definitions/domain.AssigmentStatus'
      updatedAt:
        type: string
    type: object
  domain.AssigmentStatus:
    enum:
    - active
    - closed
    type: string
    x-enum-varnames:
    - AssigmentStatusActive
    - AssigmentStatusClosed
  domain.DashboardCard:
    properties:
      key:
        $ref: '#/definitions/domain.DashboardCardKey'
      label:
        type: string
      progress:
        type: integer
      trend:
        type: integer
      value:
        type: integer
    type: object
  domain.DashboardCardKey:
    enum:
    - total_machines
    - active_machines
    - total_operators
    - active_assignments
    type: string
    x-enum-varnames:
    - DashboardCardTotalMachines
    - DashboardCardActiveMachines
    - DashboardCardTotalOperators
    - DashboardCardActiveAssignments
  domain.FuelType:
    enum:
    - diesel
    - gasoline
    - electric
    - hybrid
    type: string
    x-enum-varnames:
    - FuelTypeDiesel
    - FuelTypeGasoline
    - FuelTypeElectric
    - FuelTypeHybrid
  domain.Implement:
    properties:
      brand:
        type: string
      capacity:
        type: number
      code:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        type: integer
      model:
        type: string
      name:
        type: string
      notes:
        type: string
      status:
        $ref: '#/definitions/domain.AssetStatus'
      type:
        $ref: '#/definitions/domain.ImplementType'
      updatedAt:
        type: string
      working_width:
        type: number
      year:
        type: integer
    type: object
  domain.ImplementType:
    enum:
    - plow
    - disc_harrow
    - cultivator
    - seeder
    - fertilizer_spreader
    - sprayer
    - trailer
    - header
    - other
    type: string
    x-enum-varnames:
    - ImplementTypePlow
    - ImplementTypeDiscHarrow
    - ImplementTypeCultivator
    - ImplementTypeSeeder
    - ImplementTypeFertilizerSpreader
    - ImplementTypeSprayer
    - ImplementTypeTrailer
    - ImplementTypeHeader
    - ImplementTypeOther
  domain.Machine:
    properties:
      brand:
        type: string
      code:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      fuel_type:
        $ref: '#/definitions/domain.FuelType'
      id:
        type: integer
      model:
        type: string
      name:
        type: string
      notes:
        type: string
      operating_hours:
        type: number
      registration_number:
        type: string
      status:
        $ref: '#/definitions/domain.AssetStatus'
      type:
        $ref: '#/definitions/domain.MachineType'
      updatedAt:
        type: string
      working_hours:
        type: number
      year:
        type: integer
    type: object
  domain.MachineStatus:
    enum:
    - active
    - maintenance
    - inactive
    - active
    - maintenance
    - inactive
    type: string
    x-enum-varnames:
    - AssetStatusActive
    - AssetStatusMaintenance
    - AssetStatusInactive
    - MachineStatusActive
    - MachineStatusMaintenance
    - MachineStatusInactive
  domain.MachineType:
    enum:
    - tractor
    - combine
    - drone
    - sprayer
    - car
    - small_truck
    - other
    type: string
    x-enum-varnames:
    - MachineTypeTractor
    - MachineTypeCombine
    - MachineTypeDrone
    - MachineTypeSprayer
    - MachineTypeCar
    - MachineTypeSmallTruck
    - MachineTypeOther
  domain.Operator:
    properties:
      allowed_machine_types:
        items:
          $ref: '#/definitions/domain.MachineType'
        type: array
      createdAt:
        type: string
      deletedAt:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      status:
        $ref: '#/definitions/domain.OperatorStatus'
      updatedAt:
        type: string
    type: object
  domain.OperatorStatus:
    enum:
    - active
    - inactive
    type: string
    x-enum-varnames:
    - OperatorStatusActive
    - OperatorStatusInactive
  domain.UserProfile:
    properties:
