      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      profile_photo:
        type: string
      role:
        type: string
      role_code:
        type: string
      role_id:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  dto.AssigmentResponse:
