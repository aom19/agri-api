            properties:
              message:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Stergere asignare
      tags:
      - assignments
    get:
      parameters:
      - description: ID asignare
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Assigment'
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtinere asignare
      tags:
      - assignments
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID asignare
        in: path
        name: id
        required: true
        type: integer
      - description: Date actualizare
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAssigmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Assigment'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizare asignare
      tags:
      - assignments
