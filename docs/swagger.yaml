host: localhost:8080
info:
  contact: {}
  description: API REST pentru managementul mașinilor agricole, operatorilor și asignărilor.
  title: Agri API
  version: "1.0"
paths:
  /assignments:
    get:
      parameters:
      - default: 1
        description: Numar pagina
        in: query
        name: page
        type: integer
      - default: 10
        description: Rezultate per pagina
        in: query
        name: limit
        type: integer
      - description: Filtru status
        in: query
        name: status
        type: string
      - description: Filtru operator
        in: query
        name: operator_id
        type: integer
      - description: Filtru masina
        in: query
        name: machine_id
        type: integer
      - default: start_date
        description: Camp sortare
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Ordine
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedAssignmentsResponse'
      security:
      - BearerAuth: []
      summary: Listare asignari
      tags:
      - assignments
    post:
      consumes:
      - application/json
      parameters:
      - description: Date asignare
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAssigmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Assigment'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Creare asignare
      tags:
      - assignments
  /assignments/{id}:
    delete:
