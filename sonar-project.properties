# Configurare analiză SonarQube — rulează cu: make sonar-api
sonar.projectKey=agri-api
sonar.projectName=Agri API
sonar.sourceEncoding=UTF-8

sonar.sources=.
# docs/ = Swagger generat, tmp/ = binare air, uploads/ = fișiere utilizatori,
# migrations/ și seeds/ = SQL (nu e analizat în Community, doar zgomot la duplicări)
sonar.exclusions=docs/**,tmp/**,uploads/**,migrations/**,seeds/**,**/*_test.go

sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage și rezultatele testelor, generate de `make test-cover` (sonar-api le rulează automat)
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json
# Nu intră în procentul de coverage: pornirea aplicației și codul care are nevoie de
# infrastructură reală (Postgres, Redis). Restul (servicii, handler-e HTTP, auth, config) e măsurat.
sonar.coverage.exclusions=cmd/**,internal/db/**,internal/redis/**,internal/repository/postgres/**

# Excepții verificate manual (în config, nu în UI, ca să se aplice la toți cei care rulează analiza local)
# Șabloanele de e-mail folosesc intenționat tabele și atribute ca align/cellpadding/width:
# Outlook și mulți clienți de e-mail nu suportă layout CSS, deci „modernizarea” lor ar strica afișarea.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S1827
sonar.issue.ignore.multicriteria.e1.resourceKey=internal/email/templates/**
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S5257
sonar.issue.ignore.multicriteria.e2.resourceKey=internal/email/templates/**
